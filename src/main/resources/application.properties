spring.application.name=moving-api

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moving_database}
spring.datasource.username=${env.DB_USERNAME:postgres}
spring.datasource.password=${env.DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# 1. Show the SQL in the console
spring.jpa.show-sql=true

# 2. Make the SQL pretty and readable
spring.jpa.properties.hibernate.format_sql=true

# 3. Show the actual values (parameters) passed to the query
logging.level.org.hibernate.orm.jdbc.bind=trace

# 4. Automatically update the database schema based on the entities
spring.jpa.hibernate.ddl-auto=validate


# Firebase Admin SDK credentials (path to service-account JSON). If left blank,
# falls back to src/main/resources/google-service-account.json, then to
# Application Default Credentials (e.g. GOOGLE_APPLICATION_CREDENTIALS env var).
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:classpath:google-service-account.json}

# Flyway: the "public" schema already had tables from a previous run but no
# flyway_schema_history table. baseline-on-migrate tells Flyway to treat the
# existing schema as already being at baselineVersion (default 1) and only
# apply migrations newer than that, instead of failing.
spring.flyway.baseline-on-migrate=true

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

