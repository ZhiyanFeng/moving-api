spring.application.name=moving-api

logging.pattern.console=${CONSOLE_LOG_PATTERN:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %cyan(%msg%n)}


spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/moving_database}
spring.datasource.username=${env.DB_USERNAME:postgres}
spring.datasource.password=${env.DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# 1. Show the SQL in the console
spring.jpa.show-sql=true

# 2. Make the SQL pretty and readable
spring.jpa.properties.hibernate.format_sql=true

# 3. Show the actual values (parameters) passed to the query
logging.level.org.hibernate.orm.jdbc.bind=trace

# 4. Automatically update the database schema based on the entities
spring.jpa.hibernate.ddl-auto=validate